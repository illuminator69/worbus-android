name: Build

# Worbus P4 (design §6.9): Android only. Pull requests and branch pushes build a debug APK; a `v*`
# tag builds a signed release APK and attaches it to a DRAFT release on this repository. The signed
# job is inert until the four signing secrets exist (KEYSTORE, KEY_ALIAS, KEY_PASSWORD,
# KEYSTORE_PASSWORD): it says so in the log and stops green, and releases stay workstation-built.
# Worbus P5 (design §6.6): before drafting, the built APK's certificate must be the release key's,
# whose SHA-256 is recorded in androidApp/release-cert.sha256; while that file says `unset`, or on a
# mismatch, the job fails and nothing is drafted. Worbus P6: after that check the job writes SHA256SUMS
# for the APK and attaches it beside the APK. Nothing here publishes anywhere but this repository.

on:
  push:
    paths:
      - androidApp/**
      - composeApp/**
      - gradle/**
      - build.gradle.kts
      - settings.gradle.kts
      - gradle.properties
      - .github/workflows/build.yml
      - "!**/strings.xml"
    tags:
      - 'v*'
    branches:
      - '**'
  pull_request:
    paths:
      - androidApp/**
      - composeApp/**
      - gradle/**
      - build.gradle.kts
      - settings.gradle.kts
      - gradle.properties
      - .github/workflows/build.yml
      - "!**/strings.xml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-debug:
    name: Android (debug)
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build with Gradle (debug)
        run: |
          ./gradlew :androidApp:assembleDebug --stacktrace
          mv androidApp/build/outputs/apk/debug/*.apk ./

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: worbus-debug-android
          path: ./*.apk
          compression-level: 0
          if-no-files-found: error

  release:
    name: Android (signed release)
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'illuminator69/worbus-android' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # A job's `if:` cannot read `secrets`, so the check is a step whose output gates the rest.
      - name: Check signing secrets
        id: signing
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The four signing secrets are not all set; no signed release is built. Releases stay workstation-built."
          fi

      - name: Checkout repository
        if: steps.signing.outputs.ok == 'true'
        uses: actions/checkout@v6

      - name: Setup JDK
        if: steps.signing.outputs.ok == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        if: steps.signing.outputs.ok == 'true'
        uses: gradle/actions/setup-gradle@v5

      - name: Build with Gradle (signed release)
        if: steps.signing.outputs.ok == 'true'
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_STORE_FILE: ${{ github.workspace }}/release.keystore
        run: |
          trap 'rm -f release.keystore' EXIT
          printf '%s' "$KEYSTORE" | base64 -d > release.keystore
          ./gradlew :androidApp:assembleRelease --stacktrace
          mv androidApp/build/outputs/apk/release/Worbus.apk "./Worbus-${GITHUB_REF_NAME}.apk"

      # A wrong-key APK is never published: the certificate must be the one recorded in the repo.
      - name: Check the APK's certificate against release-cert.sha256
        if: steps.signing.outputs.ok == 'true'
        run: |
          set -euo pipefail
          want="$(tr -d '[:space:]' < androidApp/release-cert.sha256)"
          if [ "$want" = "unset" ]; then
            echo "::error::androidApp/release-cert.sha256 says unset: the release key's fingerprint is not recorded, so no release is drafted."
            exit 1
          fi
          if ! printf '%s' "$want" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::androidApp/release-cert.sha256 is not 64 lower-case hex characters."
            exit 1
          fi
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          got="$("$apksigner" verify --print-certs "./Worbus-${GITHUB_REF_NAME}.apk" \
            | sed -n 's/.*certificate SHA-256 digest: *//p' | tr -d ': ' | tr 'A-F' 'a-f' | sort -u)"
          if [ "$got" != "$want" ]; then
            echo "::error::The APK is signed by ${got:-nothing readable}, not the release key ${want}. No release is drafted."
            exit 1
          fi
          echo "The APK's certificate is the release key's (${want})."

      # Written only after the certificate check above, so a wrong-key APK is never summed.
      - name: Write SHA256SUMS
        if: steps.signing.outputs.ok == 'true'
        run: |
          set -euo pipefail
          sha256sum "Worbus-${GITHUB_REF_NAME}.apk" > SHA256SUMS
          cat SHA256SUMS

      - name: Create draft release on this repository
        if: steps.signing.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" "./Worbus-${GITHUB_REF_NAME}.apk" SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --draft --generate-notes
